# Waveshare ESP32-P4 Smart 86 Box (4 inch, 720x720). The connected panel reads as
# ESP32-P4 revision v1.0, so this file sets engineering_sample. A revision 3 chip
# needs that flag set to false, and it must not ask for a 400 MHz CPU.
# Wi-Fi and the API key come from secrets.yaml beside this file:
#   wifi_ssid, wifi_password, api_encryption_key
# Compile from this directory so `path: components` finds remote_screens_panel.

esphome:
  name: ws-esp
  friendly_name: WS ESP
  min_version: 2026.7.3

esp32:
  variant: esp32p4
  flash_size: 32MB
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_SPIRAM_MEMTEST: n

psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V

esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  use_psram: true

logger:
  level: INFO
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  encryption:
    key: !secret api_encryption_key
  custom_services: true
  homeassistant_services: true

ota:
  - platform: esphome

i2c:
  - sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: false

touchscreen:
  - platform: gt911
    id: panel_touch
    reset_pin: GPIO23
    update_interval: 20ms

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO26
    frequency: 200Hz
    inverted: true
    max_power: 0.8

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: Display backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_dsi
    id: panel
    model: WAVESHARE-P4-86-PANEL
    enable_pin: GPIO33
    update_interval: never
    auto_clear_enabled: false

external_components:
  - source:
      type: local
      path: components
    components: [remote_screens_panel]

remote_screens_panel:
  screen_id: demo
  page_id: compose

lvgl:
  displays: [panel]
  touchscreens: [panel_touch]
  buffer_size: 50%
  byte_order: little_endian
  page_wrap: false
  pages:
    - widgets:
        - obj:
            width: 100%
            height: 100%
            layout:
              type: flex
              flex_flow: column
            widgets:
              - label:
                  text: Waiting for Remote Screens
                  align: center
    # These stay off the first page. Listing them makes ESPHome build the LVGL
    # widgets the runtime creates after a layout arrives.
    - widgets:
        - button:
            widgets:
              - label:
                  text: " "
        - switch:
        - slider:
        - bar:
        - arc:
        - tabview:
            tabs:
              - name: A
                widgets:
                  - label:
                      text: " "
