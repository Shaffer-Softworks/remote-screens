naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'
  # Feature folders under render/ (cards/, tiles/, freeform/) keep package
  # tech.shaffersoftworks.remotescreens.server.render for shared internal APIs.
  InvalidPackageDeclaration:
    active: false

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    allowedFunctionsPerClass: 20
    allowedFunctionsPerFile: 20
    allowedFunctionsPerObject: 20
