naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'
  InvalidPackageDeclaration:
    active: true

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    allowedFunctionsPerClass: 20
    allowedFunctionsPerFile: 20
    allowedFunctionsPerObject: 20

# Match Shaffer-Softworks/RPI: braced multiline if/else for statements; short
# expression ifs may stay one line (e.g. `if (debug) a else b`).
style:
  BracesOnIfStatements:
    active: true
    # Options: 'never', 'always', 'consistent', or 'necessary'
    singleLine: 'necessary'
    multiLine: 'always'
  # Prefer named constants over unexplained literals (see kotlin-magic-numbers-detekt.mdc).
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
    ignoreHashCodeFunction: true
    # Named consts / companion vals are fine; flag literals in locals and expressions.
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: false
    ignoreNamedArgument: true
    ignoreEnums: false
    ignoreRanges: false
    ignoreExtensionFunctions: true
    excludes: ['**/test/**', '**/androidTest/**', '**/*.kts']

# Requires detektPlugins("dev.detekt:detekt-rules-ktlint-wrapper") — see root build.gradle.kts.
# Style aligned with RPI (trailing commas, chain wrapping, arg wrapping, multiline if/else).
ktlint:
  ArgumentListWrapping:
    active: true
    autoCorrect: true
    maxLineLength: 120
    # Generated by tools/generate_catalogue.py (long ActionSpec maps on one line).
    excludes: ['**/Catalogue.kt']
  AnnotationOnSeparateLine:
    active: false
  AnnotationSpacing:
    active: false
  BackingPropertyNaming:
    active: false
