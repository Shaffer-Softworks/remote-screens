domain: humidifier
name: Humidifier
icon: air-humidifier-off
icon_on: air-humidifier
toggle: true
on_states: [on]
tap: toggle
card: humidifier
controls: [humidity]
sizes: [1x1, 2x1, 2x2]
actions:
  toggle: {service: humidifier.toggle}
  humidity: {service: humidifier.set_humidity, data: {humidity: $arg}, relative: humidity}
  mode: {service: humidifier.set_mode, data: {mode: $arg}}
predict:
  toggle: {state: "!"}
  humidity: {state: "on", attributes: {humidity: $arg}}
  mode: {attributes: {mode: $arg}}
