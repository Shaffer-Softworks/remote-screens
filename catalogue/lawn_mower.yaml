domain: lawn_mower
name: Lawn mower
icon: robot-mower
on_states: [mowing, returning]
tap: card
card: lawn_mower
sizes: [1x1, 2x1, 2x2]
actions:
  start: {service: lawn_mower.start_mowing}
  pause: {service: lawn_mower.pause}
  dock: {service: lawn_mower.dock}
predict:
  start: {state: "mowing"}
  dock: {state: "returning"}
