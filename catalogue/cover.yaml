domain: cover
name: Cover
icon: window-shutter
icon_on: window-shutter-open
toggle: true
on_states: [open, opening]
tap: toggle
card: cover
controls: [position]
sizes: [1x1, 2x1, 1x2, 2x2, full]
actions:
  toggle: {service: cover.toggle}
  open: {service: cover.open_cover}
  close: {service: cover.close_cover}
  stop: {service: cover.stop_cover}
  position: {service: cover.set_cover_position, data: {position: $arg}, relative: current_position}
  tilt: {service: cover.set_cover_tilt_position, data: {tilt_position: $arg}}
  open_tilt: {service: cover.open_cover_tilt}
  close_tilt: {service: cover.close_cover_tilt}
  stop_tilt: {service: cover.stop_cover_tilt}
predict:
  position: {attributes: {current_position: $arg}}
  tilt: {attributes: {current_tilt_position: $arg}}
