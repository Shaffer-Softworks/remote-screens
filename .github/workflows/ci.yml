name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gradle:
    name: Server, shared and player
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Detekt
        run: ./gradlew :shared:detekt :server:detekt :player:detekt
      - name: Tests
        run: ./gradlew :shared:test :server:test :player:testDebugUnitTest
      - name: Android lint
        run: ./gradlew :player:lintDebug
      - name: Player app
        run: ./gradlew :player:assembleDebug
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reports
          path: |
            */build/reports/tests/
            */build/reports/detekt/
            player/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  editor:
    name: Editor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q -p no:cacheprovider

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
          github_token: ${{ secrets.GITHUB_TOKEN }}
