name: Create HACS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver (e.g. 0.1.51). A leading v is ignored. Published as 0.1.51, not v0.1.51.
        required: true
        type: string
      draft:
        description: Create as draft release
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark as prerelease
        required: false
        type: boolean
        default: false
      release_notes:
        description: Release notes (optional). If empty, GitHub generates notes from commits.
        required: false
        type: string
        default: ""

# actions:write — allow gh workflow run when PR checks must be triggered without a PAT.
# Integration tags are the bare semver (0.1.51). Add-on releases own the v* tags (v0.1.51),
# and the add-on workflow only runs on those. The release is still published with the
# default GITHUB_TOKEN so a tag push does not start other workflows.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      branch: ${{ steps.meta.outputs.branch }}
    steps:
      - id: meta
        env:
          RAW: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RAW#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::version is empty"
            exit 1
          fi
          # Digits and [A-Za-z0-9.-] only — no '/' (breaks sed/paths).
          # No leading v: add-on releases already use v0.1.51, v0.2.67, and so on.
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)*$' \
            || { echo "::error::Invalid version: $RAW (expected e.g. 0.1.51)"; exit 1; }
          TAG="${VERSION}"
          BRANCH="release/hacs-${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

  release:
    needs: normalize
    runs-on: ubuntu-latest
    concurrency:
      group: create-hacs-release-${{ github.repository }}-${{ needs.normalize.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Optional PAT. A branch push or PR opened with the default token does not start
          # pull_request workflows, so required checks stay pending without this secret.
          token: ${{ secrets.WORKFLOW_TRIGGER_TOKEN != '' && secrets.WORKFLOW_TRIGGER_TOKEN || github.token }}

      - name: Bump manifest, push release branch, publish release
        env:
          # Release tag is created with this token so it does not start .github/workflows/addon.yml.
          GH_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ secrets.WORKFLOW_TRIGGER_TOKEN != '' && secrets.WORKFLOW_TRIGGER_TOKEN || github.token }}
          HAS_WORKFLOW_PAT: ${{ secrets.WORKFLOW_TRIGGER_TOKEN != '' }}
          VERSION: ${{ needs.normalize.outputs.version }}
          TAG: ${{ needs.normalize.outputs.tag }}
          BRANCH: ${{ needs.normalize.outputs.branch }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null || true
          if git rev-parse "refs/remotes/origin/${BRANCH}" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "refs/remotes/origin/${BRANCH}"
          else
            git checkout -b "$BRANCH"
          fi

          export MANIFEST_VERSION="$VERSION"
          python3 << 'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["MANIFEST_VERSION"]
          path = Path("custom_components/remote_screens/manifest.json")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'("version"\s*:\s*")[^"]*"',
              lambda match: f'{match.group(1)}{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("custom_components/remote_screens/manifest.json has no version field")
          path.write_text(updated, encoding="utf-8")
          PY

          git add custom_components/remote_screens/manifest.json
          if git diff --staged --quiet; then
            echo "::notice::Manifest already at ${VERSION}; reusing existing release branch."
          else
            git commit -m "chore: bump manifest to ${VERSION} for ${TAG}"
          fi

          # Re-runs reuse branch name release/hacs-<version>. Force-with-lease updates that
          # branch only when the remote ref still matches what we fetched.
          if git rev-parse "refs/remotes/origin/${BRANCH}" >/dev/null 2>&1; then
            git push -u origin "$BRANCH" --force-with-lease="refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          else
            git push -u origin "$BRANCH"
          fi

          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "::notice::Add-on tag v${VERSION} already exists. This release uses tag ${TAG} so the two do not collide."
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            TAG_SHA=$(git rev-parse "${TAG}^{}" 2>/dev/null || git rev-parse "refs/tags/${TAG}")
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::Integration tag ${TAG} already exists at ${TAG_SHA}, but branch HEAD is ${HEAD_SHA}. Delete that tag only if it is unused, or pick another integration version."
              exit 1
            fi
          fi

          # HACS zip_release: HACS extracts into custom_components/remote_screens/,
          # so archive paths must be integration-root (manifest.json, __init__.py, …),
          # not custom_components/remote_screens/… (that would double-nest).
          ROOT="$(git rev-parse --show-toplevel)"
          ZIP_NAME="remote_screens.zip"
          rm -f "${ROOT}/${ZIP_NAME}"
          ( cd "${ROOT}/custom_components/remote_screens" && zip -r "${ROOT}/${ZIP_NAME}" . \
            -x "*__pycache__/*" -x "*.pyc" -x "*.DS_Store" )

          EXTRA=( )
          if [ "$INPUT_DRAFT" = "true" ]; then EXTRA+=(--draft); fi
          if [ "$INPUT_PRERELEASE" = "true" ]; then EXTRA+=(--prerelease); fi

          # --latest=false keeps GitHub's Latest release on the player app (editor download link).
          # HACS still sees this release: it uses the newest published release, not the Latest flag.
          # The marker is how the add-on workflow recognizes an integration release.
          MARKER='<!-- hacs-integration-release -->'
          if gh release view "$TAG" >/dev/null 2>&1; then
            body=$(gh release view "$TAG" --json body --jq .body)
            if ! printf '%s\n' "$body" | grep -q 'hacs-integration-release'; then
              echo "::error::Tag ${TAG} is already a GitHub release and is not an integration release. Pick a version that is not an add-on tag."
              exit 1
            fi
            echo "::notice::Release ${TAG} already exists; uploading/replacing ${ZIP_NAME}."
            gh release upload "$TAG" "${ZIP_NAME}" --clobber
          elif [ -n "$RELEASE_NOTES" ]; then
            {
              echo "$MARKER"
              echo
              printf '%s\n' "$RELEASE_NOTES"
            } > /tmp/release-notes.md
            gh release create "$TAG" "${ZIP_NAME}" --target "$BRANCH" --title "Remote Screens ${VERSION}" --latest=false -F /tmp/release-notes.md "${EXTRA[@]}"
          else
            gh release create "$TAG" "${ZIP_NAME}" --target "$BRANCH" --title "Remote Screens ${VERSION}" --latest=false \
              --notes "${MARKER}" --generate-notes "${EXTRA[@]}"
          fi

          if [ "$(GH_TOKEN="$PR_TOKEN" gh pr list --head "$BRANCH" --base "$DEFAULT_BRANCH" --state open --json number -q 'length')" -eq 0 ]; then
            if GH_TOKEN="$PR_TOKEN" gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH" \
              --title "Merge HACS ${VERSION} manifest bump" \
              --body "Automated manifest bump for [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}). Merge after checks pass so \`${DEFAULT_BRANCH}\` matches the HACS release. This does not publish the add-on image. Add-on releases keep the \`v*\` tags."; then
              echo "Opened the manifest bump PR."
            else
              PR_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${BRANCH}?expand=1"
              echo "::warning::Could not open the manifest bump PR (often: repo setting 'Allow GitHub Actions to create and approve pull requests' is off, or WORKFLOW_TRIGGER_TOKEN is missing)."
              echo "Open the manifest bump PR manually: ${PR_URL}"
              echo "Open the manifest bump PR manually: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::notice::An open PR already exists for ${BRANCH}; skipping pr create."
          fi

          # Without a PAT, GitHub does not run pull_request workflows for this push/PR.
          if [ "${HAS_WORKFLOW_PAT}" != "true" ]; then
            echo "::notice::No WORKFLOW_TRIGGER_TOKEN — triggering CI on ${TAG}."
            gh workflow run ci.yml --ref "$TAG"
          fi

      - name: Summary
        if: success()
        env:
          BRANCH: ${{ needs.normalize.outputs.branch }}
          TAG: ${{ needs.normalize.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          {
            echo "## Create HACS release"
            echo "Published **${TAG}** with \`remote_screens.zip\` (HACS \`zip_release\`). The zip root is the integration (\`manifest.json\`, \`__init__.py\`, …). HACS unpacks it into \`custom_components/remote_screens/\`."
            echo ""
            echo "The manifest bump is on **\`${BRANCH}\`**. Merge the pull request **Merge HACS ${TAG} manifest bump** when that pull request exists, so **\`${DEFAULT_BRANCH}\`** matches the release."
            echo ""
            echo "Tag **\`${TAG}\`** is separate from add-on tag **\`v${TAG}\`**. This did not build the add-on or the player app, and it is not marked Latest, so the editor's player download stays on the add-on release."
            echo ""
            echo "HACS installs from the newest published release. The next add-on release also attaches \`remote_screens.zip\`, so a later add-on publish does not leave HACS without that asset."
          } >> "$GITHUB_STEP_SUMMARY"
