name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Player app and add-on files
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        run: |
          version=$(cat addon/VERSION)
          grep -q "^version: \"$version\"$" addon/config.yaml || { echo "addon/config.yaml is not $version"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match addon/VERSION $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Player app
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYER_KEYSTORE_BASE64 }}
          PLAYER_KEYSTORE_PASSWORD: ${{ secrets.PLAYER_KEYSTORE_PASSWORD }}
          PLAYER_KEY_ALIAS: ${{ secrets.PLAYER_KEY_ALIAS }}
          PLAYER_KEY_PASSWORD: ${{ secrets.PLAYER_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/player.jks"
            export PLAYER_KEYSTORE="$RUNNER_TEMP/player.jks"
          elif [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "A release needs the PLAYER_KEYSTORE_* secrets: tablets only update to an app signed with the same key"; exit 1
          fi
          ./gradlew :player:assembleRelease
          cp player/build/outputs/apk/release/player-release.apk remote-screens.apk
      - name: Add-on files
        run: tools/package_addon.sh remote-screens.apk
      - uses: actions/upload-artifact@v5
        with:
          name: addon-dist
          path: addon/dist/
      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: remote-screens.apk

  image:
    name: Image (${{ matrix.arch }})
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: addon-dist
          path: addon/dist/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/remote-screens-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: addon
          platforms: ${{ matrix.platform }}
          push: ${{ github.ref_type == 'tag' }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.package.outputs.version }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.package.outputs.version }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  release:
    name: GitHub release
    needs: [package, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: apk
      - name: Release with the player app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1 && !/^## /' addon/CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" remote-screens.apk --title "$GITHUB_REF_NAME" --notes "$notes" \
            || gh release upload "$GITHUB_REF_NAME" remote-screens.apk --clobber
