name: Remote Screens
version: "0.1.36"
slug: remote_screens
description: Home Assistant screens on Android tablets, drawn with Remote Compose
url: https://github.com/Shaffer-Softworks/remote-screens
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
image: ghcr.io/shaffer-softworks/remote-screens-{arch}
ingress: true
# 0: the Supervisor picks a free port, since on the host network 8099 is often taken.
ingress_port: 0
panel_icon: mdi:tablet-dashboard
panel_title: Remote Screens
homeassistant_api: true
hassio_api: true
discovery:
  - remote_screens
# Tablets find the add-on over mDNS and connect to port 8100, so it lives on the host's network.
host_network: true
options:
  map_tiles: ""
schema:
  map_tiles: str?
ports:
  8100/tcp: 8100
  8766/tcp: 8766
ports_description:
  8100/tcp: Tablets (players) connect here
  8766/tcp: Intercom signaling (tablets)
