name: Remote Screens
version: "0.1.0"
slug: remote_screens
description: Home Assistant screens on Android tablets, drawn with Remote Compose
url: https://github.com/sickkick/remote-screens
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
image: ghcr.io/sickkick/remote-screens-{arch}
ingress: true
ingress_port: 8099
panel_icon: mdi:tablet-dashboard
panel_title: Remote Screens
homeassistant_api: true
hassio_api: true
discovery:
  - remote_screens
# Tablets find the add-on over mDNS and connect to port 8100, so it lives on the host's network.
host_network: true
options:
  map_tiles: ""
schema:
  map_tiles: str?
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: Tablets (players) connect here
